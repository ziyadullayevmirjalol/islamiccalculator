<!doctype html>
<html><head><meta charset="utf-8"><title>e2e</title></head><body>
<pre id="out">running…</pre>
<script type="module">
import { api, fetchXlsxBlob, register, session, logout } from './js/api.js';
import { calcById, calcTypeOf } from './js/calculators.js';

const out = [];
const log = (ok, name, extra = '') => out.push(`${ok ? 'PASS' : 'FAIL'} ${name} ${extra}`);

try {
  logout();

  // 1. anonymous murabaha through the calc definition's own payload builder
  const def = calcById('murabaha');
  // The percent-unit regression case: 8,000,000 at 20% over 12 months
  // must be 800,000/month (a user typing "20" means 20%, never 2000%).
  const d1 = await api(def.endpoint, { method: 'POST', body: def.payload({
    cost: '8000000', markupMode: 'rate', markupValueRate: '20', termMonths: '12',
  }) });
  log(d1.monthlyInstallment === '800000.00', 'anon-murabaha-percent', d1.monthlyInstallment);

  // 2. register + authed calculation
  const email = `e2e-${Date.now()}@test.local`;
  await register(email, 'strong-password-1');
  log(!!session()?.accessToken, 'register');

  const zdef = calcById('wealth-zakat');
  const d2 = await api(zdef.endpoint, { method: 'POST', body: zdef.payload({
    cash: '50000000', hawlComplete: true,
  }) });
  log(d2.zakatDue === '1250000.00', 'authed-zakat', d2.zakatDue);

  // 3. history round-trip + delete
  const h = await api('/api/v1/history/?limit=5');
  log(h.entries?.length === 1 && h.entries[0].calcType === 'zakat.wealth', 'history-list',
      String(h.entries?.length));
  await api(`/api/v1/history/${h.entries[0].id}`, { method: 'DELETE' });
  const h2 = await api('/api/v1/history/?limit=5');
  log((h2.entries || []).length === 0, 'history-delete');

  // 4. validation error surfaces typed fields
  try {
    await api(def.endpoint, { method: 'POST', body: def.payload({
      cost: '1000', markupMode: 'rate', markupValueRate: '10', termMonths: '0',
    }) });
    log(false, 'validation-error');
  } catch (e) {
    log(e.code === 'VALIDATION_FAILED' && e.fields.termMonths === 'out_of_range', 'validation-error', e.fields.termMonths);
  }

  // 5. Excel export: exercises the exact shipped fetch/parse logic
  // (fetchXlsxBlob — everything downloadXlsx does short of the browser
  // file-save, which headless runners can't observe) against the real
  // backend, for several calculators, using each spec's own payload
  // builder so a future field-shape change breaks this test too.
  logout();
  const xlsxType = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  const specs = [
    ['murabaha', { cost: '8000000', markupMode: 'rate', markupValueRate: '20', termMonths: '12' }],
    ['diminishing-musharaka', { propertyValue: '300000', downPayment: '60000', annualRentalRate: '5', termMonths: '240' }],
    ['wealth-zakat', { cash: '50000000', hawlComplete: true }],
    ['sukuk', { positions: [{ name: 'A', faceValue: '100000000', purchasePrice: '95000000', distributionRateAnnual: '9', frequency: '2', termMonths: '60' }] }],
  ];
  for (const [id, values] of specs) {
    try {
      const spec = calcById(id);
      const blob = await fetchXlsxBlob(calcTypeOf(spec), spec.payload(values), 'uz');
      log(blob.type === xlsxType && blob.size > 1000, `export-${id}`, `${blob.type} ${blob.size}b`);
    } catch (e) {
      log(false, `export-${id}`, e.message);
    }
  }

  // Export of an unknown calc type must reject with the backend's own
  // typed error, not a generic network failure.
  try {
    await fetchXlsxBlob('not.a.real.calc', {}, 'uz');
    log(false, 'export-unknown-calc-type-rejected');
  } catch (e) {
    log(e.status === 400 && e.fields?.calcType === 'unknown_calc_type',
        'export-unknown-calc-type-rejected', JSON.stringify(e.fields));
  }
} catch (e) {
  out.push('FATAL ' + e.message);
}
document.getElementById('out').textContent = out.join('\n');
</script>
</body></html>
